<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌡 Temperature Converter</h1>

        <div class="input-group">
            <label for="tempInput">Enter Temperature</label>
            <input
                type="number"
                id="tempInput"
                placeholder="Enter temperature"
            >
        </div>

        <div class="btn-group">
            <button id="cToF">Celsius → Fahrenheit</button>
            <button id="fToC">Fahrenheit → Celsius</button>
        </div>

        <div class="result">
            <h3>Result</h3>
            <p id="resultText">
                The converted temperature will appear here.
            </p>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
